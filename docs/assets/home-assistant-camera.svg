<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 420" role="img" aria-labelledby="title desc">
<title id="title">Private Home Assistant motion snapshots</title><desc id="desc">An existing motion event passes a camera allowlist and active-player check. The controller fetches one bounded JPEG only when a media-capable recipient is eligible, then serves it through device authentication. One player switch controls text and images. Camera credentials never leave the controller.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="#6286a8"/></marker></defs>
<rect width="1160" height="420" rx="20" fill="#101b2a"/>
<g font-family="system-ui, sans-serif" fill="#ecf4ff"><text x="32" y="45" font-size="25" font-weight="650">Motion snapshots, kept private</text><text x="32" y="75" font-size="15" fill="#b4c7da">One event · one frame · only the active viewing session</text></g>
<g fill="#1a2c40" stroke="#456782" stroke-width="1"><rect x="30" y="108" width="196" height="132" rx="12"/><rect x="256" y="108" width="196" height="132" rx="12"/><rect x="482" y="108" width="196" height="132" rx="12"/><rect x="708" y="108" width="196" height="132" rx="12"/><rect x="934" y="108" width="196" height="132" rx="12"/></g>
<g stroke="#6286a8" stroke-width="2" marker-end="url(#arrow)"><path d="M227 174h22"/><path d="M453 174h22"/><path d="M679 174h22"/><path d="M905 174h22"/></g>
<g font-family="system-ui, sans-serif" fill="#ecf4ff" font-size="15"><g font-weight="650" font-size="17"><text x="46" y="138">1. Motion event</text><text x="272" y="138">2. Eligibility</text><text x="498" y="138">3. Bounded JPEG</text><text x="724" y="138">4. Private delivery</text><text x="950" y="138">5. Player card</text></g><g fill="#b4c7da"><text x="46" y="167">Fixed camera key</text><text x="46" y="191">Original time + ID</text><text x="46" y="215">No motion-clear alerts</text><text x="272" y="167">Active + enabled</text><text x="272" y="191">JPEG support declared</text><text x="272" y="215">Runtime saved</text><text x="498" y="167">One frame, then close</text><text x="498" y="191">640 × 360 · ≤160 KiB</text><text x="498" y="215">Memory only · short TTL</text><text x="724" y="167">Device Bearer token</text><text x="724" y="191">Runtime + expiry check</text><text x="724" y="215">No public camera URL</text><text x="950" y="167">One on/off switch</text><text x="950" y="191">Text + image together</text><text x="950" y="215">Main video continues</text></g></g>
<g font-family="system-ui, sans-serif" font-size="15"><rect x="30" y="275" width="535" height="106" rx="12" fill="#18372f" stroke="#4b9c82"/><text x="49" y="306" fill="#b6efdb" font-weight="650">No eligible media recipient → no camera request</text><text x="49" y="333" fill="#b4c7da">Text-only players keep text notifications. Fetch failures</text><text x="49" y="357" fill="#b4c7da">fall back to text; expired events never wait for a wake-up.</text><rect x="590" y="275" width="540" height="106" rx="12" fill="#242e48" stroke="#6982b2"/><text x="610" y="306" fill="#cfdbff" font-weight="650">Credentials stay on the controller</text><text x="610" y="333" fill="#b4c7da">Fixed HA origin · no redirects · no disk image archive</text><text x="610" y="357" fill="#b4c7da">Disabling notifications clears the card and its media grant.</text></g>
</svg>
