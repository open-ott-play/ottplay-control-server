image:
  repository: ghcr.io/open-ott-play/ottplay-control-server
  # Set an exact published release tag; optionally pin its manifest digest as well.
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent
existingSecret: ottplay-control-server
# Optional persistent volume for journal.path below /var/lib/ottplay-control/private.
# Provision separately; the chart never creates or deletes the claim.
journalExistingClaim: ""
service:
  type: ClusterIP
  port: 8081
ingress:
  enabled: false
  className: ""
  host: ""
  tlsSecretName: ""
resources:
  requests:
    cpu: 25m
    memory: 16Mi
  limits:
    cpu: 500m
    memory: 64Mi
nodeSelector: {}
tolerations: []
affinity: {}
