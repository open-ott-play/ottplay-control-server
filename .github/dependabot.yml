version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    groups:
      codeql:
        patterns:
          - github/codeql-action/*
      codeql-security:
        applies-to: security-updates
        patterns:
          - github/codeql-action/*
  - package-ecosystem: docker
    directory: /
    schedule: {interval: weekly}
  - package-ecosystem: gomod
    directory: /
    schedule: {interval: weekly}
