name: Tests
on:
  workflow_call: {}
permissions:
  contents: read
jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.8'
          cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Check generated wire contracts
        run: python3 scripts/generate-wire-contracts.py --check
      - name: Verify formatting and static checks
        run: |
          test -z "$(gofmt -l cmd internal)"
          go vet ./...
      - name: Run race detector
        run: go test -race -count=1 ./...
      - name: Scan reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: Exercise the native binary
        run: |
          suffix=""
          if [ "${RUNNER_OS}" = "Windows" ]; then suffix=".exe"; fi
          go build -o "dist/ottplay-control-server${suffix}" ./cmd/ottplay-control-server
          python scripts/smoke_binary.py "dist/ottplay-control-server${suffix}"
  packaging:
    name: Deployment packaging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Check deployment contracts
        run: |
          python3 scripts/check_deployment.py
          python3 -m unittest discover -s .github/release-tests -p test_deployment_package.py -v
      - name: Lint and render Kubernetes charts
        run: |
          helm lint charts/ottplay-control-server --set image.tag=v0.1.0-test.1
          helm template control charts/ottplay-control-server --set image.tag=v0.1.0-test.1 > /tmp/kubernetes.yaml
          helm template control charts/ottplay-control-server -f deploy/k3s-values.yaml --set image.tag=v0.1.0-test.1 --set ingress.enabled=true --set ingress.host=control.example.test > /tmp/k3s.yaml
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
      - name: Build native container
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          load: true
          tags: ottplay-control-server:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Exercise hardened container
        run: bash scripts/smoke_container.sh
