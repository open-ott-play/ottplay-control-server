name: Tests
on:
  workflow_call: {}
permissions:
  contents: read
jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Require consistent CI action versions
        run: |
          python3 -m pip install --require-hashes --only-binary=:all: -r .github/requirements-workflow-contracts.txt
          python3 scripts/workflow_contracts.py --actions-only
      - name: Install and run hash-locked Python quality diagnostics
        run: |
          python3 -m pip install --require-hashes --only-binary=:all: -r .github/requirements-lint.txt
          python3 -m ruff check --select E9,F63,F7,F82 cli scripts tests native tools
      - name: Check generated wire contracts
        run: python3 scripts/generate-wire-contracts.py --check
      - name: Verify formatting and static checks
        run: |
          test -z "$(gofmt -l cmd internal)"
          go vet ./...
      - name: Run race detector
        run: go test -race -count=1 ./...
      - name: Test Android maintenance agent
        if: runner.os != 'Windows'
        run: |
          cd native/android-agent
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race ./...
          python3 -m unittest discover -s . -p '*_test.py' -v
          npm ci --ignore-scripts --no-audit --no-fund
          node --test player.test.cjs
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -o /tmp/ott-android-agent .
      - name: Test terminal CLI
        run: |
          if [ "$RUNNER_OS" != Windows ]; then
            python3 -m pip install --require-hashes --only-binary=:all: -r scripts/requirements-plex-shortcuts.txt
          fi
          python3 -m unittest discover -s tests -v
      - name: Scan reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: Exercise the native binary
        run: |
          suffix=""
          if [ "${RUNNER_OS}" = "Windows" ]; then suffix=".exe"; fi
          go build -o "dist/ottplay-control-server${suffix}" ./cmd/ottplay-control-server
          python scripts/smoke_binary.py "dist/ottplay-control-server${suffix}"
  packaging:
    name: Deployment packaging
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && (vars.CI_RUNNER_LABELS || '[]') || '["ubuntu-latest"]') }}
    timeout-minutes: 20
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Check deployment contracts
        run: |
          python3 scripts/check_deployment.py
          python3 -m unittest discover -s .github/release-tests -p test_deployment_package.py -v
      - name: Lint and render Kubernetes charts
        run: |
          helm lint charts/ottplay-control-server --set image.tag=v0.1.0-test.1
          helm template control charts/ottplay-control-server --set image.tag=v0.1.0-test.1 > /tmp/kubernetes.yaml
          helm template control charts/ottplay-control-server -f deploy/k3s-values.yaml --set image.tag=v0.1.0-test.1 --set ingress.enabled=true --set ingress.host=control.example.test > /tmp/k3s.yaml
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build native container
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: ottplay-control-server:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Exercise hardened container
        run: bash scripts/smoke_container.sh
