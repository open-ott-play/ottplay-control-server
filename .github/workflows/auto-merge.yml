name: Auto Merge PRs

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled, edited, converted_to_draft]
  workflow_run:
    workflows: [Auto Approve PRs, Quality gate, CodeQL, Dependency Review]
    types: [completed]
  status:
  check_run:
    types: [completed]
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:


concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number }}-${{ contains(fromJSON('["workflow_run","status","check_run","schedule","workflow_dispatch"]'), github.event_name) && github.run_id || (github.event.action != 'edited' || github.event.changes.base) && 'state' || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  auto-merge:
    permissions:
      contents: read
      pull-requests: write
    if: >-
      (github.event.action != 'edited' || github.event.changes.base) &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == github.event.repository.default_branch &&
      (github.event_name == 'pull_request_target' &&
       github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.base.ref == github.event.repository.default_branch) &&
      contains(fromJSON('["4alvit","californiantiramisu","dependabot[bot]","renovate[bot]"]'), github.event.pull_request.user.login) &&
      contains(github.event.pull_request.labels.*.name, 'automerge') &&
      !github.event.pull_request.draft
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/auto-merge.yml@f54201ae71e91d85514bb16ed1ffdf31b82b149f # main
    with:
      reviewed-merge: true
      reviewed-single-pass: true
      required-status-checks: CI gate
      allow-dependabot-actions-review: true
      allow-owned-bot-actions-review: true
    secrets:
      BOT_PAT: ${{ secrets.BOT_PAT }}

  recover-auto-merge:
    permissions:
      contents: read
      pull-requests: write
    if: >-
      contains(fromJSON('["workflow_run","status","check_run","schedule","workflow_dispatch"]'), github.event_name) &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    concurrency:
      group: automerge-reviewed-recovery-${{ github.repository }}
      cancel-in-progress: false
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/auto-merge.yml@f54201ae71e91d85514bb16ed1ffdf31b82b149f # main
    with:
      reviewed-merge: true
      reviewed-single-pass: true
      allow-dependabot-actions-review: true
      allow-owned-bot-actions-review: true
      required-status-checks: CI gate
    secrets:
      BOT_PAT: ${{ secrets.BOT_PAT }}
