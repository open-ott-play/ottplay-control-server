name: Auto Approve PRs

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled, edited, converted_to_draft]

# Ignored title/body edits must not cancel a pending approval for this head.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number }}-${{ (github.event.action != 'edited' || github.event.changes.base) && 'state' || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  auto-approve:
    permissions:
      contents: read
      pull-requests: write
    if: >-
      (github.event.action != 'edited' || github.event.changes.base) &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == github.event.repository.default_branch &&
      (github.event_name == 'pull_request_target' &&
       github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.base.ref == github.event.repository.default_branch) &&
      contains(fromJSON('["4alvit","californiantiramisu","dependabot[bot]","renovate[bot]"]'), github.event.pull_request.user.login) &&
      contains(github.event.pull_request.labels.*.name, 'automerge') &&
      !github.event.pull_request.draft
    # Metadata only; the pinned helper never checks out or executes PR code.
    # Include the existing owned Renovate account; keep the automerge opt-in.
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/auto-approve-reusable.yml@77b0157695fb80e4d97c3ac4819c2d1db7ba96c7 # main
    with:
      authors: '["4alvit","californiantiramisu","dependabot[bot]","renovate[bot]"]'
    secrets:
      BOT_PAT: ${{ secrets.BOT_PAT }}
      APPROVAL_PAT: ${{ secrets.APPROVAL_PAT }}
